<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">

<style>
:root{--bg:#0b0d10;--panel:#151a20;--line:#2b333d;--text:#f6f7f8;--muted:#aab2bd;--accent:#ff7a45;--yellow:#ffcc55;--green:#58d68d;--blue:#7fb4ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
header{position:sticky;top:0;z-index:20;background:#0b0d10f2;border-bottom:1px solid var(--line);padding:10px}
h1{font-size:18px;margin:0 0 8px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:8px}
.tab{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:8px 11px;border-radius:999px;font-weight:750;white-space:nowrap;touch-action:manipulation}
.tab.on{background:#fff;color:#111}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.controls input,.controls select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:14px}
#search{grid-column:1/-1}
.quick{display:flex;gap:6px;overflow-x:auto;margin-top:7px}
.quick button{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:8px 10px;border-radius:999px;white-space:nowrap;touch-action:manipulation}
.quick button.on{background:#fff;color:#111}
main{padding:10px 10px 80px;max-width:900px;margin:auto}
.summary{font-size:12px;color:var(--muted);margin:4px 2px 8px}
.card{border:1px solid var(--line);background:linear-gradient(#151a20,#101419);border-radius:14px;padding:12px;margin-bottom:9px}
.card.must{border-color:var(--accent)} .card.rumor{border-color:#725f2c;background:linear-gradient(#1d1a12,#11100d)}
.top{display:flex;gap:8px;align-items:flex-start}
.dj{font-weight:800;font-size:18px;flex:1;line-height:1.15}
.rating{font-weight:800;background:#222a34;padding:5px 7px;border-radius:999px}
.when{font-weight:750;margin-top:7px}
.countdown{margin-top:5px;font-size:14px;font-weight:850;color:var(--green)}
.countdown.soon{color:var(--yellow)} .countdown.past{color:var(--muted)}
.camp{font-weight:700;margin-top:4px} .coords{color:#ffb000}
.meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.meta span{font-size:11px;border:1px solid #3b4653;border-radius:999px;padding:4px 6px}
.meta .rumorBadge{border-color:#8d7430;color:#ffd66e}
.notes{color:#c8ced6;font-size:13px;line-height:1.35;margin-top:7px}
#jumpTop{position:fixed;right:12px;bottom:12px;border:1px solid var(--line);background:#151a20;color:white;border-radius:999px;padding:10px 12px;font-weight:700}
@media(min-width:700px){.controls{grid-template-columns:2fr 1fr 1fr 1fr 1fr}#search{grid-column:auto}}

.journalActions{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.journalActions button{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:8px 10px;border-radius:10px;font-weight:700;touch-action:manipulation}
.journalActions button.attendedOn{background:#dff7e7;color:#12351f;border-color:#7fc694}
.noteBox{width:100%;margin-top:8px;padding:10px;border:1px solid var(--line);border-radius:10px;background:#0f1318;color:var(--text);font:inherit;min-height:72px;resize:vertical}
.photoLabel{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);padding:8px 10px;border-radius:10px;font-weight:700;cursor:pointer}
.photoInput{display:none}
.photoGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:8px}
.photoGrid img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.journalStatus{font-size:12px;color:var(--muted);margin-top:5px}
.attendedHeader{display:flex;gap:8px;align-items:center;margin:4px 0 10px}
.attendedCount{font-size:12px;color:var(--muted)}
</style>
</head>

    req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains('photos'))db.createObjectStore('photos',{keyPath:'key'});};
    req.onsuccess=()=>{photoDB=req.result;resolve(photoDB);};
    req.onerror=()=>reject(req.error);
  });
}
async function putPhotos(eventId,files){
  const db=await openPhotoDB(); const tx=db.transaction('photos','readwrite'); const store=tx.objectStore('photos');
  for(const f of files){
    const key=eventId+'_'+Date.now()+'_'+Math.random().toString(36).slice(2);
    store.put({key,eventId,blob:f,name:f.name,type:f.type});
  }
  return new Promise((resolve,reject)=>{tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);});
}
async function getPhotos(eventId){
  const db=await openPhotoDB(); const tx=db.transaction('photos','readonly'); const store=tx.objectStore('photos');
  return new Promise((resolve,reject)=>{
    const req=store.getAll(); req.onsuccess=()=>resolve(req.result.filter(x=>x.eventId===eventId)); req.onerror=()=>reject(req.error);
  });
}

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function fmtDate(ds){if(!ds)return'Date/time TBA';return new Date(ds+'T12:00:00-07:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}
function fmtTime(t){if(!t)return'';const[h,m]=t.split(':').map(Number);const ap=h>=12?'PM':'AM';return `${((h+11)%12)+1}:${String(m).padStart(2,'0')} ${ap}`}
function stamp(e){const t=e.start||e.eventStart;if(!e.date||!t)return Number.MAX_SAFE_INTEGER;return new Date(e.date+'T'+t+':00-07:00').getTime()}
function pacificDateString(){
  const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Los_Angeles',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());
  const g=k=>parts.find(p=>p.type===k).value;
  return `${g('year')}-${g('month')}-${g('day')}`;
}
function countdown(e){
  const s=stamp(e); if(!Number.isFinite(s)||s===Number.MAX_SAFE_INTEGER)return '';
  let diff=s-Date.now(), past=diff<0; diff=Math.abs(diff);
  const d=Math.floor(diff/86400000); diff%=86400000;
  const h=Math.floor(diff/3600000); diff%=3600000;
  const m=Math.floor(diff/60000);
  let text='';
  if(d>0) text=`${d}d ${h}h ${m}m`;
  else if(h>0) text=`${h}h ${m}m`;
  else text=`${m}m`;
  return past?`Started ${text} ago`:`Starts in ${text}`;
}
function render(){
 let q=$('search').value.trim().toLowerCase(), dj=$('dj').value, day=$('day').value, camp=$('camp').value, min=+$('rating').value;
 let today=pacificDateString();
 let arr=E.filter(e=>{
   const blob=[e.dj,e.camp,e.coords,e.notes,e.rumorStatus].join(' ').toLowerCase();
   if(q&&!blob.includes(q))return false;if(dj&&e.dj!==dj)return false;if(day&&e.date!==day)return false;if(camp&&e.camp!==camp)return false;if((e.rating||0)<min)return false;
   if(state.exact && !(e.start && e.confidence.toLowerCase().includes('exact')))return false;
   if(state.b2b && !e.b2b)return false;
   if(state.high && !['MUST SEE','HIGH'].includes(e.priority))return false;
   if(state.view==='today' && (e.rumor || e.date!==today))return false;
   if(state.view==='upcoming' && (e.rumor || stamp(e)<=Date.now()))return false;
   if(state.view==='rumors' && !e.rumor)return false;if(state.view==='attended' && !entry(e.id).attended)return false;
   if(!['rumors','all'].includes(state.view) && e.rumor)return false;
   return true;
 });
 arr.sort((a,b)=>{
   if(a.rumor!==b.rumor)return a.rumor?1:-1;
   return stamp(a)-stamp(b)||(b.rating||0)-(a.rating||0)||a.dj.localeCompare(b.dj);
 });
 $('summary').textContent=`${arr.length} items · chronological by default · Pacific Time`;
 $('attendedInfo').style.display=state.view==='attended'?'flex':'none';$('attendedCount').textContent=state.view==='attended'?`${arr.length} saved`:'';$('list').innerHTML=arr.map(e=>{
   const wt=e.rumor?(e.date?`${fmtDate(e.date)}${e.start?' · '+fmtTime(e.start)+(e.end?' – '+fmtTime(e.end):''):e.eventStart?' · '+fmtTime(e.eventStart)+' onward':' · window TBA'}`:'Date/time TBA'):e.start?`${fmtTime(e.start)}${e.end?' – '+fmtTime(e.end):''}`:e.eventStart?`Event starts ${fmtTime(e.eventStart)} · slot TBA`:'Time TBA';
   const cd=e.rumor?'':countdown(e); const soon=!e.rumor&&stamp(e)-Date.now()<21600000&&stamp(e)>Date.now();
   return `<div class="card ${e.priority==='MUST SEE'?'must':''} ${e.rumor?'rumor':''}">
    <div class="top"><div class="dj">${esc(e.dj)}</div><div class="rating">${e.rating!=null?e.rating.toFixed(1):'—'}</div></div>
    <div class="when">${e.rumor?'Rumor / unconfirmed · '+wt:fmtDate(e.date)+' · '+wt}</div>
    ${cd?`<div class="countdown ${soon?'soon':''} ${stamp(e)<Date.now()?'past':''}">${cd}</div>`:''}
    <div class="camp">${esc(e.camp)} ${e.coords?`<span class="coords">· ${esc(e.coords)}</span>`:''}</div>
    <div class="meta">${e.rumor?`<span class="rumorBadge">RUMOR</span>`:''}${e.priority?`<span>${esc(e.priority)}</span>`:''}${e.b2b?'<span>B2B / special</span>':''}${e.confidence?`<span>${esc(e.confidence)}</span>`:''}</div>
    ${e.notes?`<div class="notes">${esc(e.notes)}</div>`:''}
    ${!e.rumor?journalControls(e):''}
   </div>`;
 }).join('') || '<div class="summary">No matching items.</div>';
 bindJournal();
}

function journalControls(e){
  const j=entry(e.id);
  return `<div class="journalActions">
    <button type="button" class="${j.attended?'attendedOn':''}" data-attend="${e.id}">${j.attended?'✓ Attended':'Mark attended'}</button>
    <button type="button" data-note-toggle="${e.id}">✎ Notes</button>
    <label class="photoLabel">＋ Photos<input class="photoInput" type="file" accept="image/*" multiple data-photo="${e.id}"></label>
  </div>
  <div id="noteWrap_${e.id}" style="display:${j.note?'block':'none'}">
    <textarea class="noteBox" data-note="${e.id}" placeholder="What do you remember about this set? Favorite track, who you were with, where you were standing…">${esc(j.note||'')}</textarea>
    <div class="journalStatus" id="status_${e.id}">${j.note?'Saved on this device':''}</div>
  </div>
  <div class="photoGrid" id="photos_${e.id}"></div>`;
}
async function refreshPhotos(eventId){
  const box=$('photos_'+eventId); if(!box)return;
  try{
    const pics=await getPhotos(eventId);
    box.innerHTML='';
    pics.forEach(p=>{const img=document.createElement('img');img.src=URL.createObjectURL(p.blob);img.alt='Photo from this set';box.appendChild(img);});
  }catch(err){/* IndexedDB unavailable: photo UI remains, note still works */}
}
function bindJournal(){
  document.querySelectorAll('[data-attend]').forEach(b=>b.addEventListener('click',()=>{
    const id=b.dataset.attend; entry(id).attended=!entry(id).attended; saveJournal(); render();
  }));
  document.querySelectorAll('[data-note-toggle]').forEach(b=>b.addEventListener('click',()=>{
    const w=$('noteWrap_'+b.dataset.noteToggle); if(w)w.style.display=w.style.display==='none'?'block':'none';
  }));
  document.querySelectorAll('[data-note]').forEach(t=>t.addEventListener('input',()=>{
    const id=t.dataset.note; entry(id).note=t.value; saveJournal(); const s=$('status_'+id); if(s)s.textContent='Saved on this device';
  }));
  document.querySelectorAll('[data-photo]').forEach(inp=>inp.addEventListener('change',async()=>{
    const id=inp.dataset.photo; if(!inp.files?.length)return;
    const s=$('status_'+id); if(s)s.textContent='Saving photos…';
    try{await putPhotos(id,[...inp.files]); if(s)s.textContent='Photos saved on this device'; await refreshPhotos(id);}
    catch(err){if(s)s.textContent='Could not save photos in this browser';}
    inp.value='';
  }));
  document.querySelectorAll('.photoGrid').forEach(box=>{
    const id=box.id.replace('photos_',''); refreshPhotos(id);
  });
}

[...new Set(E.map(e=>e.dj).filter(Boolean))].sort((a,b)=>a.localeCompare(b)).forEach(v=>$('dj').insertAdjacentHTML('beforeend',`<option value="${esc(v)}">${esc(v)}</option>`));
[...new Set(E.map(e=>e.date).filter(Boolean))].sort().forEach(v=>$('day').insertAdjacentHTML('beforeend',`<option value="${v}">${fmtDate(v)}</option>`));
[...new Set(E.map(e=>e.camp).filter(Boolean))].sort((a,b)=>a.localeCompare(b)).forEach(v=>$('camp').insertAdjacentHTML('beforeend',`<option value="${esc(v)}">${esc(v)}</option>`));
['search','dj','day','camp','rating'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',render));
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');state.view=b.dataset.view;render();}));
function toggle(id,key){$ (id).addEventListener('click',()=>{state[key]=!state[key];$(id).classList.toggle('on',state[key]);render()})}
toggle('exact','exact');toggle('b2b','b2b');toggle('high','high');
$('reset').addEventListener('click',()=>{$('search').value='';$('dj').value='';$('day').value='';$('camp').value='';$('rating').value='0';state.exact=state.b2b=state.high=false;state.view='all';document.querySelectorAll('.quick button').forEach(b=>b.classList.remove('on'));document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.view==='all'));render()});
$('jumpTop').addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));
render();
setInterval(()=>{
  if(!document.activeElement?.matches('textarea,input,select')) render();
},30000);
</script>
